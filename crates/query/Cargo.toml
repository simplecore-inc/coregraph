[package]
name = "coregraph-query"
version = "0.1.0"
edition = "2021"

[dependencies]
coregraph-core = { path = "../core" }
coregraph-graph = { path = "../graph" }
coregraph-manifest = { path = "../manifest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { workspace = true }
ignore = { workspace = true }

[dev-dependencies]
tempfile = "3"
criterion = { workspace = true }
coregraph-extractor = { path = "../extractor" }

[[bench]]
name = "impact"
harness = false
