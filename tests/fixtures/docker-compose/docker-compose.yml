version: "3.8"
services:
  web:
    image: nginx:1.25
    depends_on:
      - api
    ports:
      - "80:80"
  api:
    image: example/api:latest
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgres://db:5432/app
  db:
    image: postgres:16
    volumes:
      - db-data:/var/lib/postgresql/data
  redis:
    image: redis:7

volumes:
  db-data:
