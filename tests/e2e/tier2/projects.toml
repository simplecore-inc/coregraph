# Tier 2 real-world projects (robustness smoke test).
# SHA-pinned for reproducibility. Ranges are WIDE: tier 2 catches collapse,
# the golden scenarios catch precision. Bump sha + ranges together.
#
# Rationale for current edge ranges:
#   The graph currently expands references into per-reference edges, which
#   produces very large counts on real repos (>10M on excalidraw). We set
#   ranges around observed baselines; a regression that removes edges wholesale
#   (e.g. broken resolver) will fall below min_edges.

[[project]]
name = "zustand"
url = "https://github.com/pmndrs/zustand.git"
sha = "32013285083648e8d58ba1f76d73b9bdc02fef50"
min_symbols = 50
max_symbols = 50000
min_edges = 100
max_edges = 100000000
max_wall_clock_sec = 240
well_known_symbols = ["create"]

[[project]]
name = "excalidraw"
url = "https://github.com/excalidraw/excalidraw.git"
sha = "1caec99b290c75cda05385e637138998807a65ae"
min_symbols = 5000
max_symbols = 500000
min_edges = 10000
max_edges = 1000000000
max_wall_clock_sec = 900
well_known_symbols = ["loadFromBlob"]

