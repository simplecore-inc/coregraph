# Kotlin SQL framework — covers the Kotlin extractor (regex symbols + call
# sites) and the hand-authored kotlin.tsg stack-graphs rules for cross-file
# resolution. Observed baseline ~4.8k symbols / ~40.6k edges at this SHA (after
# the comment/string-scrub that removed phantom keyword-in-prose symbols).
# Ranges are wide; a broken Kotlin path collapses well below min.
[[project]]
name = "exposed"
url = "https://github.com/JetBrains/Exposed.git"
sha = "5dbbcfb422a938fe60bace521fc62c6801e801a1"
min_symbols = 3000
max_symbols = 100000
min_edges = 10000
max_edges = 5000000
max_wall_clock_sec = 300
well_known_symbols = ["Table", "Transaction"]
