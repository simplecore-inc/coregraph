<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="cg-title cg-desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="cg-title">CoreGraph highlights</title>
  <desc id="cg-desc">Four strengths: token-efficient for LLM agents, fast and stays fast, many languages in one graph, and monorepo-native.</desc>
  <style>
    .brand { font-size: 24px; font-weight: 700; fill: #111827; }
    .sub   { font-size: 14px; fill: #6b7280; }
    .ctitle{ font-size: 18px; font-weight: 700; fill: #1f2937; }
    .detail{ font-size: 13px; fill: #4b5563; }
  </style>

  <!-- panel -->
  <rect x="1" y="1" width="898" height="538" rx="16" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- header -->
  <text x="40" y="46" class="brand">CoreGraph at a glance</text>
  <text x="40" y="72" class="sub">One queryable graph — token-cheap, fast, multi-language, monorepo-ready.</text>
  <line x1="24" y1="86" x2="876" y2="86" stroke="#eef0f2"/>

  <!-- Card 1: Token-efficient (violet) -->
  <g transform="translate(24,102)">
    <rect width="416" height="198" rx="12" fill="#fafbfc" stroke="#e5e7eb"/>
    <circle cx="44" cy="44" r="22" fill="#7c3aed"/>
    <g transform="translate(44,44)" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M -11,-7 L -3,0 L -11,7"/>
      <path d="M 11,-7 L 3,0 L 11,7"/>
    </g>
    <text x="80" y="40" class="ctitle">Token-efficient</text>
    <rect x="80" y="50" width="30" height="3" rx="1.5" fill="#7c3aed"/>
    <text x="28" y="96"  class="detail">Built for LLM agents</text>
    <text x="28" y="122" class="detail">Exact symbols &amp; edges, not whole files</text>
    <text x="28" y="148" class="detail">llm output · token budget 8000 / 2000 / 16000</text>
    <text x="28" y="174" class="detail">low-confidence noise filtered out</text>
  </g>

  <!-- Card 2: Fast (amber) -->
  <g transform="translate(460,102)">
    <rect width="416" height="198" rx="12" fill="#fafbfc" stroke="#e5e7eb"/>
    <circle cx="44" cy="44" r="22" fill="#f59e0b"/>
    <polygon transform="translate(44,44)" points="3,-13 -8,3 -1,3 -3,13 9,-4 2,-4" fill="#ffffff"/>
    <text x="80" y="40" class="ctitle">Fast, and stays fast</text>
    <rect x="80" y="50" width="30" height="3" rx="1.5" fill="#f59e0b"/>
    <text x="28" y="96"  class="detail">One index pass: ~280 files in ~2.3s</text>
    <text x="28" y="122" class="detail">Daemon serves queries from memory (IPC)</text>
    <text x="28" y="148" class="detail">Warm-load from snapshot · never stale</text>
    <text x="28" y="174" class="detail">no re-indexing per command</text>
  </g>

  <!-- Card 3: Many languages (blue) -->
  <g transform="translate(24,318)">
    <rect width="416" height="198" rx="12" fill="#fafbfc" stroke="#e5e7eb"/>
    <circle cx="44" cy="44" r="22" fill="#2563eb"/>
    <g transform="translate(44,44)">
      <rect x="-13" y="-10" width="26" height="6" rx="2" fill="#ffffff" opacity="0.5"/>
      <rect x="-13" y="-2"  width="26" height="6" rx="2" fill="#ffffff" opacity="0.78"/>
      <rect x="-13" y="6"   width="26" height="6" rx="2" fill="#ffffff"/>
    </g>
    <text x="80" y="40" class="ctitle">Many languages, one graph</text>
    <rect x="80" y="50" width="30" height="3" rx="1.5" fill="#2563eb"/>
    <text x="28" y="96"  class="detail">Java · TS · JS · Python · Go · Rust · Kotlin</text>
    <text x="28" y="122" class="detail">+ config (YAML / TOML / JSON) &amp; Markdown</text>
    <text x="28" y="148" class="detail">symbols + cross-file resolution</text>
    <text x="28" y="174" class="detail">unified into a single index</text>
  </g>

  <!-- Card 4: Monorepo-native (teal) -->
  <g transform="translate(460,318)">
    <rect width="416" height="198" rx="12" fill="#fafbfc" stroke="#e5e7eb"/>
    <circle cx="44" cy="44" r="22" fill="#0d9488"/>
    <g transform="translate(44,44)">
      <line x1="-10" y1="-6" x2="10" y2="-6" stroke="#ffffff" stroke-width="2.2"/>
      <line x1="-10" y1="-6" x2="0"  y2="10" stroke="#ffffff" stroke-width="2.2"/>
      <line x1="10"  y1="-6" x2="0"  y2="10" stroke="#ffffff" stroke-width="2.2"/>
      <circle cx="-10" cy="-6" r="4.5" fill="#ffffff"/>
      <circle cx="10"  cy="-6" r="4.5" fill="#ffffff"/>
      <circle cx="0"   cy="10" r="4.5" fill="#ffffff"/>
    </g>
    <text x="80" y="40" class="ctitle">Monorepo-native</text>
    <rect x="80" y="50" width="30" height="3" rx="1.5" fill="#0d9488"/>
    <text x="28" y="96"  class="detail">Cross-package &amp; cross-language, one graph</text>
    <text x="28" y="122" class="detail">refs resolve across dir / language bounds</text>
    <text x="28" y="148" class="detail">daemon caches many projects (LRU + heap)</text>
    <text x="28" y="174" class="detail">not several disconnected indexes</text>
  </g>
</svg>
