name: PR impact review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # New pushes to a PR supersede in-flight reviews.
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: CoreGraph review
    # Skip fork PRs: GitHub downgrades GITHUB_TOKEN to read-only for them, so the
    # comment-post step would 403 and hard-fail. Same-repo PRs get a write token.
    # (Do NOT "fix" this by switching to pull_request_target — that would run
    # untrusted PR code with a write token + secrets.)
    if: github.event.pull_request.head.repo.fork == false
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/review
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          exclude-tests: 'true'
