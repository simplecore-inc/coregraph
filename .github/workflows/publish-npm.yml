name: Publish npm packages

# Publishes the npm packages for a *released* version by reusing the platform
# binaries already attached to its GitHub Release — it does not rebuild, so npm
# ships the exact bytes the Release does. Run it independently of the Release and
# the VS Code publish. Give it the release tag (e.g. v0.1.0); blank resolves to
# the latest GitHub Release. Defaults to a dry-run; set dry_run=false (with
# NPM_TOKEN configured) to actually upload.
#
# Requires the release to carry the per-platform assets that `release.yml`
# attaches; publishing a tag with no assets fails fast.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish, e.g. v0.1.0 (blank = latest release)'
        required: false
        type: string
      dry_run:
        description: 'Validate the publish without uploading'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Serialize publishes; never cancel one in flight.
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Assemble + publish
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release tag
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if [[ -n "${INPUT_TAG}" ]]; then
            ref="${INPUT_TAG}"
          else
            ref="$(gh release view --repo "${REPO}" --json tagName -q .tagName)"
          fi
          if [[ -z "${ref}" ]]; then
            echo "::error::No tag given and no GitHub Release found to default to." >&2
            exit 1
          fi
          echo "Publishing npm from release: ${ref}"
          echo "ref=${ref}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pick.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download release binaries
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.pick.outputs.ref }}
        run: |
          # Reuse the exact binaries attached to the release: download each
          # platform archive and unpack it into the <staging>/bin-<os>-<cpu>/
          # layout that assemble-from-artifacts.mjs expects. The platform list
          # and archive names come from config.mjs, matching release.yml.
          version="${TAG#v}"
          mkdir -p staging dl
          node -e 'import("./npm/config.mjs").then(m=>{for(const p of m.PLATFORMS)console.log(p.os+" "+p.cpu+" "+p.binary)})' > /tmp/platforms.txt
          while read -r os cpu bin; do
            dest="staging/bin-${os}-${cpu}"
            mkdir -p "$dest"
            if [[ "$os" == "win32" ]]; then
              asset="coregraph-${version}-${os}-${cpu}.zip"
              gh release download "$TAG" --repo "$REPO" -p "$asset" -D dl --clobber
              unzip -o "dl/${asset}" -d "$dest"
            else
              asset="coregraph-${version}-${os}-${cpu}.tar.gz"
              gh release download "$TAG" --repo "$REPO" -p "$asset" -D dl --clobber
              tar -xzf "dl/${asset}" -C "$dest"
            fi
            if [[ ! -f "${dest}/${bin}" ]]; then
              echo "::error::release asset for ${os}-${cpu} did not contain ${bin}" >&2
              exit 1
            fi
          done < /tmp/platforms.txt

      - name: Assemble packages
        run: node npm/scripts/assemble-from-artifacts.mjs staging

      - name: Publish to npm
        env:
          # An npm automation token with publish rights to the @coregraph scope.
          # When unset, the step falls back to a dry-run so the workflow still
          # validates packaging end to end.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "NPM_TOKEN secret not set — running dry-run only."
            node npm/scripts/publish.mjs --dry-run
          elif [[ "${DRY_RUN}" == "true" ]]; then
            echo "dry_run=true — validating packaging without uploading."
            node npm/scripts/publish.mjs --dry-run
          else
            node npm/scripts/publish.mjs
          fi
